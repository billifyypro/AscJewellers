<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Software Runner - Pro Edition</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
    
    <style>
        /* Base Reset & Styling */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Outfit', sans-serif;
        }

        /* Deep Tech Animated Gradient Background */
        body {
            background: #0f172a;
            background-image: 
                radial-gradient(at 0% 0%, hsla(253,16%,7%,1) 0, transparent 50%), 
                radial-gradient(at 50% 0%, hsla(225,39%,30%,0.3) 0, transparent 50%), 
                radial-gradient(at 100% 0%, hsla(339,49%,30%,0.3) 0, transparent 50%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            color: #e2e8f0;
            overflow: hidden; /* Prevents scroll during modal */
        }

        /* Glassmorphism Wrapper (Untouched for UI Stability) */
        .wrapper {
            background: rgba(30, 41, 59, 0.4);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            width: 100%;
            max-width: 480px;
            border-radius: 24px;
            padding: 40px 30px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.1);
            position: relative;
            overflow: hidden;
            transition: filter 0.3s ease;
        }

        .wrapper.blurred {
            filter: blur(8px) brightness(0.7);
        }

        /* Subtle top glow line for the card */
        .wrapper::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 2px;
            background: linear-gradient(90deg, transparent, #3b82f6, #8b5cf6, transparent);
        }

        /* Header Styling */
        header {
            text-align: center;
            margin-bottom: 40px;
        }

        header h1 {
            font-size: 2.2rem;
            font-weight: 800;
            letter-spacing: -0.5px;
            text-transform: uppercase;
            background: linear-gradient(to right, #60a5fa, #a78bfa);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 8px;
        }

        header p {
            font-size: 1rem;
            color: #94a3b8;
            font-weight: 300;
        }

        /* Options Container */
        .options-container {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        /* Premium Dark Card */
        .option-card {
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.05);
            padding: 20px 24px;
            border-radius: 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            overflow: hidden;
            z-index: 1;
        }

        .option-card:hover {
            transform: translateY(-4px);
            border-color: rgba(139, 92, 246, 0.4);
            box-shadow: 0 10px 30px -10px rgba(139, 92, 246, 0.3);
            background: rgba(30, 41, 59, 0.8);
        }

        /* Card Content Flex Layout */
        .card-meta-side {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        /* Futuristic Signal Icons styling */
        .signal-icon {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 40px;
            height: 40px;
            border-radius: 10px;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.08);
            color: #60a5fa;
            transition: all 0.3s ease;
        }

        .option-card:hover .signal-icon {
            background: rgba(139, 92, 246, 0.1);
            border-color: rgba(139, 92, 246, 0.3);
            color: #a78bfa;
            box-shadow: 0 0 12px rgba(139, 92, 246, 0.2);
        }

        .option-title {
            font-size: 1.1rem;
            font-weight: 600;
            color: #f8fafc;
            letter-spacing: 0.3px;
        }

        /* Futuristic Gradient Button */
        .open-btn {
            background: linear-gradient(135deg, #3b82f6 0%, #8b5cf6 100%);
            color: #ffffff;
            text-decoration: none;
            padding: 10px 24px;
            border-radius: 12px;
            font-size: 0.95rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(139, 92, 246, 0.3);
            position: relative;
            z-index: 2;
            cursor: pointer;
            border: none;
        }

        .open-btn:hover {
            box-shadow: 0 6px 25px rgba(139, 92, 246, 0.6);
            transform: scale(1.05);
            background: linear-gradient(135deg, #2563eb 0%, #7c3aed 100%);
        }

        /* Submenu Accordion Architecture */
        .accordion-trigger {
            cursor: pointer;
        }

        .arrow-indicator {
            color: #64748b;
            transition: transform 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .option-card.expanded .arrow-indicator {
            transform: rotate(180deg);
            color: #a78bfa;
        }

        .sub-menu-container {
            max-height: 0;
            opacity: 0;
            overflow: hidden;
            transition: max-height 0.4s cubic-bezier(0.4, 0, 0.2, 1), opacity 0.3s ease;
            display: flex;
            flex-direction: column;
            gap: 12px;
            padding-left: 20px;
            border-left: 2px dashed rgba(139, 92, 246, 0.2);
            margin-top: -10px;
            margin-bottom: 5px;
        }

        .sub-menu-container.open {
            max-height: 200px;
            opacity: 1;
            margin-top: -10px;
            padding-top: 5px;
            padding-bottom: 5px;
        }

        .sub-option-card {
            background: rgba(15, 23, 42, 0.4);
            border: 1px solid rgba(255, 255, 255, 0.03);
            padding: 14px 20px;
            border-radius: 14px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: all 0.3s ease;
        }

        .sub-option-card:hover {
            background: rgba(30, 41, 59, 0.5);
            border-color: rgba(96, 165, 250, 0.2);
            box-shadow: inset 0 0 10px rgba(96, 165, 250, 0.05);
        }

        .sub-option-title {
            font-size: 1rem;
            font-weight: 500;
            color: #cbd5e1;
        }

        /* Footer Accent */
        .footer-note {
            text-align: center;
            margin-top: 40px;
            font-size: 0.8rem;
            color: #64748b;
            font-weight: 400;
            letter-spacing: 1px;
            text-transform: uppercase;
        }
        
        .footer-note span {
            color: #8b5cf6;
            font-weight: 600;
        }

        /* =========================================
           PRO OVERLAY & MODAL STYLES
           ========================================= */
        .overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(15, 23, 42, 0.8);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }

        .overlay.active {
            opacity: 1;
            pointer-events: all;
        }

        .modal {
            background: rgba(30, 41, 59, 0.9);
            border: 1px solid rgba(139, 92, 246, 0.3);
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7);
            text-align: center;
            max-width: 400px;
            width: 90%;
            transform: translateY(20px) scale(0.95);
            opacity: 0;
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            display: none;
        }

        .modal.active {
            display: block;
            transform: translateY(0) scale(1);
            opacity: 1;
        }

        /* Confirm Modal */
        .modal h2 {
            font-size: 1.5rem;
            color: #f8fafc;
            margin-bottom: 10px;
        }
        
        .modal p {
            color: #94a3b8;
            margin-bottom: 30px;
            font-size: 1rem;
        }

        .btn-group {
            display: flex;
            gap: 15px;
            justify-content: center;
        }

        .btn-cancel {
            background: transparent;
            color: #94a3b8;
            border: 1px solid #475569;
            padding: 10px 24px;
            border-radius: 10px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s;
        }

        .btn-cancel:hover {
            background: rgba(255, 255, 255, 0.05);
            color: #f8fafc;
        }

        .btn-confirm {
            background: linear-gradient(135deg, #10b981 0%, #059669 100%);
            color: #fff;
            border: none;
            padding: 10px 24px;
            border-radius: 10px;
            cursor: pointer;
            font-weight: 600;
            box-shadow: 0 4px 15px rgba(16, 185, 129, 0.3);
            transition: all 0.3s;
        }

        .btn-confirm:hover {
            transform: scale(1.05);
            box-shadow: 0 6px 20px rgba(16, 185, 129, 0.5);
        }

        /* Loading Spinner */
        .loader {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            border: 4px solid rgba(139, 92, 246, 0.1);
            border-top-color: #8b5cf6;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px auto;
        }

        .loading-text {
            color: #60a5fa;
            font-weight: 600;
            letter-spacing: 2px;
            text-transform: uppercase;
            animation: pulse 1.5s ease-in-out infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        @keyframes pulse {
            0%, 100% { opacity: 0.5; }
            50% { opacity: 1; }
        }

        /* Animated Tick SVG */
        .success-animation {
            margin: 0 auto 15px auto;
        }

        .checkmark {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            display: block;
            stroke-width: 3;
            stroke: #10b981;
            stroke-miterlimit: 10;
            margin: 10% auto;
            box-shadow: inset 0px 0px 0px #10b981;
            animation: fill .4s ease-in-out .4s forwards, scale .3s ease-in-out .9s both;
        }

        .checkmark__circle {
            stroke-dasharray: 166;
            stroke-dashoffset: 166;
            stroke-width: 3;
            stroke-miterlimit: 10;
            stroke: #10b981;
            fill: none;
            animation: stroke 0.6s cubic-bezier(0.65, 0, 0.45, 1) forwards;
        }

        .checkmark__check {
            transform-origin: 50% 50%;
            stroke-dasharray: 48;
            stroke-dashoffset: 48;
            animation: stroke 0.3s cubic-bezier(0.65, 0, 0.45, 1) 0.6s forwards;
        }

        @keyframes stroke {
            100% { stroke-dashoffset: 0; }
        }

        @keyframes scale {
            0%, 100% { transform: none; }
            50% { transform: scale3d(1.1, 1.1, 1); }
        }

        @keyframes fill {
            100% { box-shadow: inset 0px 0px 0px 40px rgba(16, 185, 129, 0.1); }
        }

        .success-text {
            color: #10b981;
            font-size: 1.2rem;
            font-weight: 600;
            margin-top: 10px;
        }
    </style>
</head>
<body>

    <div class="wrapper" id="main-wrapper">
        <header>
            <h1>ASC Software</h1>
            <p>Select a portal to launch</p>
        </header>

        <div class="options-container">
            
            <div class="option-card">
                <div class="card-meta-side">
                    <div class="signal-icon">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path><polyline points="9 22 9 12 15 12 15 22"></polyline></svg>
                    </div>
                    <span class="option-title">Retail Software</span>
                </div>
                <button onclick="initiateLaunch('https://billifyypro.github.io/retailproasc/')" class="open-btn">Launch</button>
            </div>

            <div class="option-card">
                <div class="card-meta-side">
                    <div class="signal-icon">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="12 2 2 7 12 12 22 7 12 2"></polygon><polygon points="2 17 12 22 22 17"></polygon><polygon points="2 12 12 17 22 12"></polygon></svg>
                    </div>
                    <span class="option-title">Wholesale Software</span>
                </div>
                <button onclick="initiateLaunch('https://billifyypro.github.io/ascwholesale/')" class="open-btn">Launch</button>
            </div>

            <div class="option-card accordion-trigger" onclick="toggleChatbotMenu(this)">
                <div class="card-meta-side">
                    <div class="signal-icon" style="color: #a78bfa;">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect><polyline points="9 22 9 16 15 16 15 22"></polyline><path d="M12 3v13"></path><path d="M3 12h18"></path></svg>
                    </div>
                    <span class="option-title">Chatbot AI System</span>
                </div>
                <div class="arrow-indicator">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"></polyline></svg>
                </div>
            </div>

            <div class="sub-menu-container" id="chatbot-dropdown">
                
                <div class="sub-option-card">
                    <div class="card-meta-side">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#60a5fa" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path></svg>
                        <span class="sub-option-title">Chatbot AI</span>
                    </div>
                    <button onclick="event.stopPropagation(); initiateLaunch('https://billifyypro.github.io/ASCchatbot/')" class="open-btn" style="padding: 7px 16px; font-size: 0.85rem;">Open</button>
                </div>

                <div class="sub-option-card">
                    <div class="card-meta-side">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#10b981" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"></path></svg>
                        <span class="sub-option-title">Operate Chatbot</span>
                    </div>
                    <button onclick="event.stopPropagation(); initiateLaunch('https://billifyypro.github.io/RetialChatbot/')" class="open-btn" style="padding: 7px 16px; font-size: 0.85rem;">Open</button>
                </div>

            </div>

        </div>

        <div class="footer-note">
            Powered by <span>Software Runner v1.0</span>
        </div>
    </div>

    <div class="overlay" id="overlay">
        
        <div class="modal" id="modal-confirm">
            <h2>Launch Portal</h2>
            <p>Are you sure you want to open this software module?</p>
            <div class="btn-group">
                <button class="btn-cancel" onclick="cancelLaunch()">No, Cancel</button>
                <button class="btn-confirm" onclick="confirmLaunch()">Yes, Proceed</button>
            </div>
        </div>

        <div class="modal" id="modal-loading">
            <div class="loader"></div>
            <div class="loading-text">Initializing Systems...</div>
        </div>

        <div class="modal" id="modal-success">
            <div class="success-animation">
                <svg class="checkmark" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 52 52">
                    <circle class="checkmark__circle" cx="26" cy="26" r="25" fill="none"/>
                    <path class="checkmark__check" fill="none" d="M14.1 27.2l7.1 7.2 16.7-16.8"/>
                </svg>
            </div>
            <div class="success-text">Launched Successfully!</div>
        </div>

    </div>

    <script>
        let targetLaunchUrl = "";
        const overlay = document.getElementById('overlay');
        const mainWrapper = document.getElementById('main-wrapper');
        const modalConfirm = document.getElementById('modal-confirm');
        const modalLoading = document.getElementById('modal-loading');
        const modalSuccess = document.getElementById('modal-success');

        // Toggle Expandable Accordion Menu Interface smoothly
        function toggleChatbotMenu(cardElement) {
            const dropdown = document.getElementById('chatbot-dropdown');
            cardElement.classList.toggle('expanded');
            dropdown.classList.toggle('open');
        }

        // Function to create a highly professional UI chime using Web Audio API
        function playSuccessSound() {
            try {
                const AudioContext = window.AudioContext || window.webkitAudioContext;
                const ctx = new AudioContext();

                // Note 1
                const osc1 = ctx.createOscillator();
                const gain1 = ctx.createGain();
                osc1.connect(gain1);
                gain1.connect(ctx.destination);
                osc1.type = 'sine';
                osc1.frequency.setValueAtTime(880, ctx.currentTime); // A5 note
                gain1.gain.setValueAtTime(0, ctx.currentTime);
                gain1.gain.linearRampToValueAtTime(0.3, ctx.currentTime + 0.05);
                gain1.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.4);
                osc1.start(ctx.currentTime);
                osc1.stop(ctx.currentTime + 0.4);

                // Note 2 (slightly delayed higher pitch for that "Ting-Ting" effect)
                const osc2 = ctx.createOscillator();
                const gain2 = ctx.createGain();
                osc2.connect(gain2);
                gain2.connect(ctx.destination);
                osc2.type = 'sine';
                osc2.frequency.setValueAtTime(1108.73, ctx.currentTime + 0.1); // C#6 note
                gain2.gain.setValueAtTime(0, ctx.currentTime + 0.1);
                gain2.gain.linearRampToValueAtTime(0.3, ctx.currentTime + 0.15);
                gain2.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 1.0);
                osc2.start(ctx.currentTime + 0.1);
                osc2.stop(ctx.currentTime + 1.0);
            } catch(e) {
                console.log("Web Audio API not supported on this browser.");
            }
        }

        function hideAllModals() {
            modalConfirm.classList.remove('active');
            modalLoading.classList.remove('active');
            modalSuccess.classList.remove('active');
        }

        // 1. Click Launch -> Show Confirm Box
        function initiateLaunch(url) {
            targetLaunchUrl = url;
            hideAllModals();
            mainWrapper.classList.add('blurred');
            overlay.classList.add('active');
            modalConfirm.classList.add('active');
        }

        // 2. Click No -> Cancel Process
        function cancelLaunch() {
            overlay.classList.remove('active');
            mainWrapper.classList.remove('blurred');
            targetLaunchUrl = "";
        }

        // 3. Click Yes -> Loading for 4s -> Success Tick & Sound -> Redirect
        function confirmLaunch() {
            hideAllModals();
            modalLoading.classList.add('active');

            // Wait 4 Seconds exactly as requested
            setTimeout(() => {
                hideAllModals();
                modalSuccess.classList.add('active');
                
                // Play sound precisely when tick appears
                playSuccessSound();

                // Wait 1.5 seconds for the user to see the cool tick animation before redirecting
                setTimeout(() => {
                    window.location.href = targetLaunchUrl;
                }, 1500);

            }, 4000);
        }
    </script>
</body>
</html>
