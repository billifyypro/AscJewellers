<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ASC JEWELLERS | Premium Collection</title>
    <!-- FontAwesome for WhatsApp Icon -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        /* CSS: Luxury Theme (Black, Gold, White) */
        :root {
            --primary-bg: #0a0a0a;
            --secondary-bg: #1a1a1a;
            --gold: #D4AF37;
            --gold-hover: #f1c40f;
            --text-light: #f5f5f5;
            --text-muted: #aaaaaa;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Helvetica Neue', Arial, sans-serif;
            scroll-behavior: smooth;
        }

        body {
            background-color: var(--primary-bg);
            color: var(--text-light);
            line-height: 1.6;
        }

        /* Header */
        header {
            background-color: var(--secondary-bg);
            padding: 20px 50px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #333;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .logo {
            font-size: 28px;
            font-weight: bold;
            color: var(--gold);
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        nav a {
            color: var(--text-light);
            text-decoration: none;
            margin-left: 30px;
            font-size: 14px;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: color 0.3s ease;
        }

        nav a:hover {
            color: var(--gold);
        }

        /* Live Rates Bar */
        .live-rates-bar {
            background-color: #111;
            padding: 15px 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 20px;
            border-bottom: 1px solid var(--gold);
            flex-wrap: wrap;
        }

        .rate-input-group {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .rate-input-group label {
            color: var(--gold);
            font-weight: bold;
            font-size: 14px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .rate-input-group input {
            background: var(--primary-bg);
            border: 1px solid #444;
            color: var(--text-light);
            padding: 8px 12px;
            border-radius: 4px;
            font-size: 16px;
            width: 120px;
            outline: none;
            transition: border-color 0.3s;
        }

        .rate-input-group input:focus {
            border-color: var(--gold);
        }

        /* Hero Section */
        .hero {
            text-align: center;
            padding: 80px 20px;
            background: linear-gradient(rgba(0,0,0,0.7), rgba(0,0,0,0.7)), url('https://images.unsplash.com/photo-1515562141207-7a88fb7ce338?q=80&w=2000&auto=format&fit=crop') center/cover;
            border-bottom: 2px solid var(--gold);
        }

        .hero h1 {
            font-size: 48px;
            margin-bottom: 10px;
            font-weight: 300;
        }

        .hero p {
            color: var(--gold);
            font-size: 18px;
            letter-spacing: 2px;
        }

        /* Product Grid */
        .container {
            max-width: 1200px;
            margin: 50px auto;
            padding: 0 20px;
        }

        .section-title {
            text-align: center;
            font-size: 32px;
            margin-bottom: 40px;
            color: var(--gold);
            font-weight: 300;
        }

        .product-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 30px;
        }

        .product-card {
            background-color: var(--secondary-bg);
            border: 1px solid #333;
            border-radius: 8px;
            overflow: hidden;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            cursor: pointer;
        }

        .product-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 20px rgba(212, 175, 55, 0.15);
            border-color: var(--gold);
        }

        .product-image-container {
            width: 100%;
            height: 300px;
            overflow: hidden;
            position: relative;
        }

        .product-image {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.5s ease;
        }

        .product-card:hover .product-image {
            transform: scale(1.05);
        }

        .image-indicator {
            position: absolute;
            bottom: 10px;
            right: 10px;
            background: rgba(0,0,0,0.8);
            color: var(--gold);
            padding: 4px 8px;
            font-size: 12px;
            border-radius: 4px;
        }

        .product-info {
            padding: 20px;
            text-align: center;
            position: relative;
        }

        .product-category {
            color: var(--text-muted);
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 8px;
        }

        .product-title {
            font-size: 18px;
            margin-bottom: 10px;
            font-weight: 500;
        }

        .product-weight {
            font-size: 12px;
            color: var(--text-muted);
            margin-bottom: 10px;
        }

        .product-price {
            color: var(--gold);
            font-size: 22px;
            font-weight: bold;
        }

        /* Modal for Multiple Images & Zoom */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.95);
            z-index: 1000;
            justify-content: center;
            align-items: center;
            flex-direction: column;
        }

        .modal-content {
            max-width: 90%;
            max-height: 65vh;
            overflow: hidden; /* Important for zoom effect */
            border: 2px solid var(--gold);
            border-radius: 4px;
            position: relative;
            cursor: crosshair;
        }

        .modal-content img {
            max-width: 100%;
            max-height: 65vh;
            display: block;
            transition: transform 0.2s ease; /* Smooth zoom transition */
        }

        .close-modal {
            position: absolute;
            top: 20px;
            right: 40px;
            color: var(--text-light);
            font-size: 40px;
            cursor: pointer;
            transition: color 0.3s ease;
            z-index: 1001;
        }

        .close-modal:hover {
            color: var(--gold);
        }

        .modal-thumbnails {
            display: flex;
            gap: 10px;
            margin-top: 20px;
            overflow-x: auto;
            max-width: 90%;
            padding-bottom: 10px;
        }

        .modal-thumbnails img {
            width: 70px;
            height: 70px;
            object-fit: cover;
            cursor: pointer;
            border: 2px solid transparent;
            border-radius: 4px;
            transition: border-color 0.3s, transform 0.3s;
        }

        .modal-thumbnails img:hover, .modal-thumbnails img.active {
            border-color: var(--gold);
            transform: scale(1.05);
        }

        .modal-details {
            margin-top: 15px;
            text-align: center;
        }
        
        /* Floating WhatsApp Button */
        .whatsapp-float {
            position: fixed;
            bottom: 30px;
            right: 30px;
            background-color: #25d366;
            color: #fff;
            width: 60px;
            height: 60px;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 30px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
            z-index: 999;
            transition: transform 0.3s, background-color 0.3s;
            text-decoration: none;
        }

        .whatsapp-float:hover {
            transform: scale(1.1);
            background-color: #1ebe57;
            color: #fff;
        }
        
        /* Footer */
        footer {
            background-color: var(--secondary-bg);
            text-align: center;
            padding: 30px;
            border-top: 1px solid #333;
            margin-top: 50px;
            color: var(--text-muted);
            font-size: 14px;
        }

        @media (max-width: 768px) {
            header { flex-direction: column; gap: 15px; }
            nav a { margin: 0 10px; }
            .rate-input-group input { width: 100px; }
        }
    </style>
</head>
<body>

    <header>
        <div class="logo">ASC JEWELLERS</div>
        <nav>
            <a href="#">Home</a>
            <a href="#collections">Collections</a>
            <!-- Direct WhatsApp link in Navigation -->
            <a href="https://wa.me/919026526053" target="_blank">Contact</a>
        </nav>
    </header>

    <!-- Live Rates Calculator Bar -->
    <div class="live-rates-bar">
        <div class="rate-input-group">
            <label for="goldRateInput">Gold Rate (/g): ₹</label>
            <input type="number" id="goldRateInput" value="7000" oninput="updateRates()">
        </div>
        <div class="rate-input-group">
            <label for="silverRateInput">Silver Rate (/g): ₹</label>
            <input type="number" id="silverRateInput" value="85" oninput="updateRates()">
        </div>
    </div>

    <section class="hero">
        <h1>Elegance Defined</h1>
        <p>Exclusive handcrafted luxury jewelry</p>
    </section>

    <div class="container" id="collections">
        <h2 class="section-title">Our Collections</h2>
        <div class="product-grid" id="product-grid"></div>
    </div>

    <!-- Enhanced Modal with Zoom Feature -->
    <div class="modal" id="imageModal">
        <span class="close-modal" onclick="closeModal()">&times;</span>
        <div class="modal-content" id="modalImageWrapper">
            <img id="mainModalImage" src="" alt="Jewelry">
        </div>
        <div class="modal-thumbnails" id="modalThumbnails"></div>
        <div class="modal-details">
            <h3 id="modalTitle" style="color: #fff; margin-bottom: 5px;"></h3>
            <p id="modalWeight" style="color: var(--text-muted); font-size: 14px; margin-bottom: 5px;"></p>
            <p id="modalPrice" style="color: var(--gold); font-weight: bold; font-size: 24px;"></p>
        </div>
    </div>

    <!-- Professional Floating WhatsApp Button -->
    <a href="https://wa.me/919026526053" class="whatsapp-float" target="_blank" title="Chat with us on WhatsApp">
        <i class="fab fa-whatsapp"></i>
    </a>

    <footer>
        <p>&copy; 2026 ASC JEWELLERS. All Rights Reserved.</p>
    </footer>

    <script>
        /* =========================================
           PRODUCT DATA (With Weight & Material)
           ========================================= */
        const products = [
            {
                id: 1,
                name: "Royal Diamond Necklace",
                basePrice: 150000, 
                material: "Diamond", // Doesn't use live rates
                category: "Necklace",
                images: [
                    "https://images.unsplash.com/photo-1599643478514-4a18350db269?q=80&w=800&auto=format&fit=crop",
                    "https://images.unsplash.com/photo-1515562141207-7a88fb7ce338?q=80&w=800&auto=format&fit=crop"
                ]
            },
            {
                id: 2,
                name: "24k Pure Gold Ring",
                material: "Gold", 
                weight: 10, // Weight in grams
                makingCharges: 5000, // Fixed making charges in ₹
                category: "Rings",
                images: [
                    "https://images.unsplash.com/photo-1605100804763-247f67b2548e?q=80&w=800&auto=format&fit=crop",
                    "https://images.unsplash.com/photo-1515562141207-7a88fb7ce338?q=80&w=800&auto=format&fit=crop",
                    "https://images.unsplash.com/photo-1599643478514-4a18350db269?q=80&w=800&auto=format&fit=crop"
                ]
            },
            {
                id: 3,
                name: "Pure Silver Anklet",
                material: "Silver",
                weight: 50, // Weight in grams
                makingCharges: 1500, // Fixed making charges in ₹
                category: "Anklets",
                images: [
                    "https://images.unsplash.com/photo-1535632066927-ab7c9ab60908?q=80&w=800&auto=format&fit=crop"
                ]
            },
            {
                id: 4,
                name: "Gold Bridal Bracelet",
                material: "Gold",
                weight: 25, // Weight in grams
                makingCharges: 12000,
                category: "Bracelets",
                images: [
                    "https://images.unsplash.com/photo-1611591437281-460bfbe1220a?q=80&w=800&auto=format&fit=crop",
                    "https://images.unsplash.com/photo-1599643478514-4a18350db269?q=80&w=800&auto=format&fit=crop"
                ]
            }
        ];

        /* =========================================
           FUNCTIONALITY SCRIPT
           ========================================= */
        const productGrid = document.getElementById('product-grid');
        const modal = document.getElementById('imageModal');
        const mainModalImage = document.getElementById('mainModalImage');
        const modalImageWrapper = document.getElementById('modalImageWrapper');
        const modalThumbnails = document.getElementById('modalThumbnails');
        const modalTitle = document.getElementById('modalTitle');
        const modalPrice = document.getElementById('modalPrice');
        const modalWeight = document.getElementById('modalWeight');

        // Initial Rates
        let currentGoldRate = parseFloat(document.getElementById('goldRateInput').value) || 0;
        let currentSilverRate = parseFloat(document.getElementById('silverRateInput').value) || 0;

        // Function to calculate dynamic price based on material
        function calculateFinalPrice(product) {
            if (product.material === "Gold" && product.weight) {
                return (currentGoldRate * product.weight) + (product.makingCharges || 0);
            } else if (product.material === "Silver" && product.weight) {
                return (currentSilverRate * product.weight) + (product.makingCharges || 0);
            }
            return product.basePrice || 0; // Fallback to base price for diamonds/others
        }

        // Format number to Indian Rupee
        function formatRupee(amount) {
            return new Intl.NumberFormat('en-IN', { style: 'currency', currency: 'INR', maximumFractionDigits: 0 }).format(amount);
        }

        // Update Rates on Input Change
        function updateRates() {
            currentGoldRate = parseFloat(document.getElementById('goldRateInput').value) || 0;
            currentSilverRate = parseFloat(document.getElementById('silverRateInput').value) || 0;
            renderProducts(); // Re-render to show updated prices instantly
        }

        // Render Products
        function renderProducts() {
            productGrid.innerHTML = '';
            products.forEach(product => {
                const finalPrice = calculateFinalPrice(product);
                const priceFormatted = formatRupee(finalPrice);
                const imageCountText = product.images.length > 1 ? `<div class="image-indicator">+${product.images.length - 1} Images</div>` : '';
                const weightText = product.weight ? `${product.weight}g` : 'Premium';
                
                const card = document.createElement('div');
                card.className = 'product-card';
                card.onclick = () => openModal(product, priceFormatted);
                
                card.innerHTML = `
                    <div class="product-image-container">
                        <img src="${product.images[0]}" alt="${product.name}" class="product-image">
                        ${imageCountText}
                    </div>
                    <div class="product-info">
                        <div class="product-category">${product.category} | ${product.material}</div>
                        <h3 class="product-title">${product.name}</h3>
                        <div class="product-weight">Net Weight: ${weightText}</div>
                        <div class="product-price">${priceFormatted}</div>
                    </div>
                `;
                productGrid.appendChild(card);
            });
        }

        // Open Modal to view multiple images
        function openModal(product, priceFormatted) {
            modal.style.display = "flex";
            mainModalImage.src = product.images[0];
            modalTitle.innerText = product.name;
            modalPrice.innerText = priceFormatted;
            modalWeight.innerText = product.weight ? `Material: ${product.material} | Weight: ${product.weight}g | Making: ₹${product.makingCharges}` : `Material: ${product.material}`;
            
            // Reset Zoom
            mainModalImage.style.transform = "scale(1)";
            mainModalImage.style.transformOrigin = "center center";

            modalThumbnails.innerHTML = '';
            
            if(product.images.length > 1) {
                product.images.forEach((imgSrc, index) => {
                    const thumb = document.createElement('img');
                    thumb.src = imgSrc;
                    if(index === 0) thumb.classList.add('active');
                    
                    thumb.onclick = (e) => { 
                        mainModalImage.src = imgSrc; 
                        // Manage active class
                        document.querySelectorAll('.modal-thumbnails img').forEach(i => i.classList.remove('active'));
                        e.target.classList.add('active');
                        // Reset zoom when image changes
                        mainModalImage.style.transform = "scale(1)";
                    };
                    modalThumbnails.appendChild(thumb);
                });
            }
        }

        // --- IMAGE ZOOM FUNCTIONALITY ---
        modalImageWrapper.addEventListener("mousemove", function(e) {
            const width = modalImageWrapper.offsetWidth;
            const height = modalImageWrapper.offsetHeight;
            const mouseX = e.offsetX;
            const mouseY = e.offsetY;
            
            // Calculate origin percentage
            const bgPosX = (mouseX / width) * 100;
            const bgPosY = (mouseY / height) * 100;
            
            mainModalImage.style.transformOrigin = `${bgPosX}% ${bgPosY}%`;
            mainModalImage.style.transform = "scale(2)"; // Adjust this value for more/less zoom
        });

        modalImageWrapper.addEventListener("mouseleave", function() {
            mainModalImage.style.transformOrigin = "center center";
            mainModalImage.style.transform = "scale(1)";
        });

        // Close Modal
        function closeModal() {
            modal.style.display = "none";
        }

        // Initialize Webpage
        renderProducts();

        // Close modal on clicking outside the image
        window.onclick = function(event) {
            if (event.target == modal) {
                closeModal();
            }
        }
    </script>
</body>
</html>
